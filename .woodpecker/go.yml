# Go engine: vet, format, build, and test on the supported native darwin/arm64
# agent. This mirrors the local `make check` / `make build` exactly.
#
# Runs on Woodpecker's local backend (commands execute on the agent host), so the
# host must have the Go toolchain, make, and Java 17+ on PATH. The pipeline does
# not install a runtime; java -version is an explicit fail-early preflight.
# If Woodpecker predates the `labels:` filter, use a top-level
# `platform: darwin/arm64` instead.
when:
  - event: push
    branch: main
  - event: pull_request
labels:
  platform: darwin/arm64
steps:
  - name: check
    commands:
      - java -version # Java 17+ host prerequisite for the bounded TLA+ gate
      - make check   # complete local static/unit/Emacs/TLA+ contract gate
      - make build   # static CGO_ENABLED=0 binary
